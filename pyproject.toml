[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-grasp-pipeline"
version = "0.1.0"
description = "Config-driven language-grounded 3D grasp proposal research pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pydantic>=2.5",
  "PyYAML>=6.0",
  "Pillow>=10.0",
  "opencv-python>=4.8",
]

[project.optional-dependencies]
3d = ["open3d>=0.18", "trimesh>=4.0"]
test = ["pytest>=8.0"]
metrics = ["scikit-learn>=1.3"]
http = ["requests>=2.31"]
all = ["open3d>=0.18", "trimesh>=4.0", "pytest>=8.0", "scikit-learn>=1.3", "requests>=2.31"]

[tool.setuptools.packages.find]
where = ["src"]
