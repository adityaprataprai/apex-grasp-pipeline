project:
  seed: 0
  artifact_dir: artifacts/submission_demo
  device: cpu
stage1:
  backend: rule
  parser_version: submission_demo_rule_v1
  ontology_path: configs/ontology.yaml
stage2:
  detector_backend: replay
  segmenter_backend: replay
  attribute_backend: none
  replay_predictions: data/demo/stage2_replay.json
  box_threshold: 0.30
  text_threshold: 0.25
  nms_iou_threshold: 0.8
  min_mask_area_ratio: 0.2
  min_accept_score: 0.60
  min_margin: 0.10
  top_k: 5
  scoring_weights:
    category: 0.30
    attribute: 0.20
    reference_2d: 0.20
    visual_quality: 0.10
    prompt_similarity: 0.20
stage3:
  depth_unit_to_m: 1.0
  min_valid_depth_m: 0.1
  max_valid_depth_m: 5.0
  min_points_per_object: 100
  scene_up_axis: [0,0,1]
  access_probe_distance_m: 0.2
  voxel_size_m: 0.0
  outlier_percentile_low: 1
  outlier_percentile_high: 99
  relation:
    depth_margin_m: 0.2
    image_overlap_min: 0.1
    near_distance_m: 0.5
    between_corridor_m: 0.1
    wedged_clearance_m: 0.05
  decision:
    relation_min_score: 0.8
    final_accept_score: 0.5
    final_margin: 0.1
    scoring_weights:
      lang: 0.2
      attr: 0.2
      rel: 0.3
      visual: 0.1
      access: 0.2
stage4:
  generator_backend: replay
  replay_predictions: data/demo/stage4_replay.json
  raw_top_k: 10
  output_top_n: 3
  gripper:
    width_min_m: 0.02
    width_max_m: 0.10
    width_margin_m: 0.005
    finger_length_m: 0.20
    finger_width_m: 0.02
    finger_height_m: 0.08
    palm_depth_m: 0.02
  workspace:
    min_xyz_m: [-1,-1,0]
    max_xyz_m: [1,1,3]
  max_approach_distance_m: 0.05
  approach_samples: 6
  collision_margin_m: 0.01
  min_contact_support: 0.01
  normal_angle_tolerance_deg: 45
  safety_clearance_m: 0.02
  scoring_weights:
    model_quality: 0.35
    clearance: 0.20
    approach: 0.15
    visibility: 0.10
    stability: 0.10
    constraint: 0.10
evaluation:
  stage1_manifest: data/manifests/stage1_eval.template.jsonl
  stage2_manifest: data/manifests/stage2_eval.template.jsonl
  stage3_manifest: data/manifests/stage3_eval.template.jsonl
  stage4_manifest: data/manifests/stage4_eval.template.jsonl
  end_to_end_manifest: data/manifests/e2e_eval.template.jsonl
